<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#06B6D4" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background for Dark Theme Preview -->
  <rect width="100%" height="100%" rx="24" fill="url(#darkBg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- ICON -->
  <g transform="translate(45, 30)">
    <!-- Shield Container -->
    <path d="M 90,20 
             C 128,20 150,38 150,74 
             C 150,119 116,146 90,156 
             C 64,146 30,119 30,74 
             C 30,38 52,20 90,20 Z" 
          fill="none" 
          stroke="url(#neonGradient)" 
          stroke-width="7" 
          filter="url(#neonGlow)" />

    <!-- Medical Cross -->
    <path d="M 80,50 H 100 V 70 H 120 V 90 H 100 V 110 H 80 V 90 H 60 V 70 H 80 Z" 
          fill="#FFFFFF" />

    <!-- Pulse Line -->
    <path d="M 46,80 L 70,80 L 82,58 L 98,102 L 110,75 L 120,80 L 134,80" 
          fill="none" 
          stroke="#38BDF8" 
          stroke-width="4" 
          stroke-linecap="round" />
  </g>

  <!-- TYPOGRAPHY -->
  <g transform="translate(240, 75)">
    <text x="0" y="44" 
          font-family="system-ui, -apple-system, 'SF Pro Display', 'Inter', sans-serif" 
          font-size="46" 
          font-weight="900" 
          letter-spacing="2" 
          fill="#FFFFFF">
      NOVTEK
    </text>

    <!-- Badge: ATK -->
    <g transform="translate(225, 6)">
      <rect x="0" y="0" width="105" height="42" rx="10" fill="url(#neonGradient)" />
      <text x="52.5" y="28" 
            text-anchor="middle" 
            font-family="system-ui, -apple-system, sans-serif" 
            font-size="22" 
            font-weight="900" 
            letter-spacing="1.5" 
            fill="#FFFFFF">
        ATK
      </text>
    </g>

    <text x="2" y="80" 
          font-family="system-ui, -apple-system, 'Inter', sans-serif" 
          font-size="13" 
          font-weight="700" 
          letter-spacing="4" 
          fill="#94A3B8">
      CLINICAL DECISION SUPPORT &amp; TRIAGE
    </text>

    <g transform="translate(2, 98)">
      <circle cx="4" cy="5" r="3.5" fill="#34D399" />
      <text x="14" y="9" 
            font-family="system-ui, -apple-system, sans-serif" 
            font-size="10" 
            font-weight="600" 
            letter-spacing="1" 
            fill="#34D399">
        AWS CLOUD ACTIVE • HIGH RELIABILITY SYSTEM
      </text>
    </g>
  </g>
</svg>
