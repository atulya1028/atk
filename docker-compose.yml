services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atk_backend_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=mysql://atk_user:atk_password@db:3306/atk_backend
      - JWT_SECRET=change-this-secret-for-production
      - ADMIN_PASSWORD=NovTekATK@1989#22
      - ADMIN_NOTIFICATION_EMAIL=admin-alerts@novtekconsulting.in
      - SMTP_HOST=novus.novtekconsulting.in
      - SMTP_PORT=465
      - SMTP_SECURE=true
      - SMTP_USER=no-reply@novus.novtekconsulting.in
      - SMTP_PASS=xJUDQeNpNT9IhmXqB8
      - SMTP_FROM="ATK Support" <no-reply@novus.novtekconsulting.in>
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: atk_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_DATABASE: atk_backend
      MYSQL_USER: atk_user
      MYSQL_PASSWORD: atk_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
