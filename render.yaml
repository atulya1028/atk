services:
  - type: web
    name: atk-api
    runtime: node
    region: singapore
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run db:generate -- --schema=prisma/schema.mysql.prisma && npm run build
    startCommand: node build
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
