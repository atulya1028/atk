version: 1.0
runtime: nodejs22
build:
  commands:
    build:
      - npm ci
      - npx prisma generate --schema=prisma/schema.mysql.prisma
      - npm run build
run:
  runtime-version: 22
  command: node build
  network:
    port: 3000
    env: APP_PORT
  health-check:
    path: /api/health
    interval: 10
    timeout: 5
    healthy-threshold: 2
    unhealthy-threshold: 3
