services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: atk
      POSTGRES_USER: atk
      POSTGRES_PASSWORD: atk_local_password
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atk -d atk"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    ports: ["8080:8080"]
    environment:
      NODE_ENV: development
      PORT: "8080"
      DATABASE_URL: postgres://atk:atk_local_password@db:5432/atk
      DIRECT_URL: postgres://atk:atk_local_password@db:5432/atk
      TRUST_PROXY: "0"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
volumes:
  postgres_data:
